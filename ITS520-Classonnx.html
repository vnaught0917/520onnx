<!DOCTYPE html>
<html>
<head>
	<title>Classification of Death Due to Covid</title>
	<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<style>
	table, th, td {border: 1px solid;}
	#leftbox {float:left, width:35%; height: 300px;}
	#sytheticButton{
		float:left;
		width:25%;
		height:300px;
		box-sizing:border-box;
		padding:10px;
	}
	#syntheticBox{
		float:right;
		width:50%;
		height: 300px;
	}
	#boxes1:after {content:""; display:Block; clear:both;}
	#boxes1 #leftbox {width:60%}
	#boxes1 #middlebox {width:25%}
	#boxes1 #syntheticButton {width:25%, margin-left:25%}
	#syntheitcbox > div {float: left; width: 50%, box-sizing: border-box;}
</style>
</head>
<body>
<h1>Classification of Death Due to Covid</h1>
<div id = "boxes1">
	<div id="leftbox">
		<h2>Input Data</h2>
		<label>Medical Surveillance System Indicator</label>
		<select id="box8c1">
    			<option value="1">1</option>
    			<option value="2">2</option>
			<option value="3">3</option>
		</select><br/>
		<label>Medical unit identifier</label>
		<select id="box8c1">
    			<option value="1">1</option>
    			<option value="2">2</option>
    			<option value="1">3</option>
    			<option value="1">4</option>
    			<option value="1">5</option>
    			<option value="1">6</option>
    			<option value="1">7</option>
    			<option value="1">8</option>
    			<option value="1">9</option>
    			<option value="1">10</option>
    			<option value="1">11</option>
    			<option value="1">12</option>
    			<option value="1">13</option>
		</select><br/>
		<label>Sex:</label>
		<select id="box8c1">
    			<option value="1">Female</option>
    			<option value="2">Male</option>
		</select><br/>
		<label>Patient Type:</label>
		<select id="box8c1">
    			<option value="1">Home</option>
    			<option value="2">Hospitalization</option>
		</select><br/>
		<label>Intubed:</label>
		<select id="box8c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Pneumonia:</label>
		<select id="box8c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<input type="text" id="box6c1" value="">Age (Just Integer in Years)<br/>
		<label>Pregnant:</label>
		<select id="box8c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Diabetes:</label>
		<select id="box8c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>COPD:</label>
		<select id="box9c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Asthma:</label>
		<select id="box10c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Immunosuppressed:</label>
		<select id="box11c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Hypertension:</label>
		<select id="box12c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Other Diseases:</label>
		<select id="box13c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Cardiovascular Problems:</label>
		<select id="box14c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Obesity:</label>
		<select id="box15c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Renal Chronic:</label>
		<select id="box16c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Tobacco Use:</label>
		<select id="box17c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<input type="text" id="box18c1" value="">Covid Test Result    (1-3 means covid) (4+ means no or inconclusive)<br/>
		<label>Admitted to ICU</label>
		<select id="box17c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<div><input type="button" value="Run" onclick="runExample1()"/></div>
	</div>
	<div id = "predictions1">
	</div>
		
<main>
</main>
<script>
let session;

async function runExample1() {

    const x = new Float32Array(20);

    x[0] = parseFloat(document.getElementById('box0c1').value) || 0;
    x[1] = parseFloat(document.getElementById('box1c1').value) || 0;
    x[2] = parseFloat(document.getElementById('box2c1').value) || 0;
    x[3] = parseFloat(document.getElementById('box3c1').value) || 0;
    x[4] = parseFloat(document.getElementById('box4c1').value) || 0;
    x[5] = parseFloat(document.getElementById('box5c1').value) || 0;
    x[6] = parseFloat(document.getElementById('box6c1').value) || 0;
    x[7] = parseFloat(document.getElementById('box7c1').value) || 0;
    x[8] = parseFloat(document.getElementById('box8c1').value) || 0;
    x[9] = parseFloat(document.getElementById('box9c1').value) || 0;
    x[10] = parseFloat(document.getElementById('box10c1').value) || 0;
    x[11] = parseFloat(document.getElementById('box11c1').value) || 0;
    x[12] = parseFloat(document.getElementById('box12c1').value) || 0;
    x[13] = parseFloat(document.getElementById('box13c1').value) || 0;
    x[14] = parseFloat(document.getElementById('box14c1').value) || 0;
    x[15] = parseFloat(document.getElementById('box15c1').value) || 0;
    x[16] = parseFloat(document.getElementById('box16c1').value) || 0;
    x[17] = parseFloat(document.getElementById('box17c1').value) || 0;
    x[18] = parseFloat(document.getElementById('box18c1').value) || 0;
    x[19] = parseFloat(document.getElementById('box19c1').value) || 0;

    const tensorX = new ort.Tensor('float32', x, [1, 20]);

    try {

        if (!session) {
            session = await ort.InferenceSession.create("GoodClassDL.onnx");
        }

        const results = await session.run({ input1: tensorX });

        const output = results.output1.data;

        const predictions = document.getElementById('predictions1');

        predictions.innerHTML = `
            <hr>
            Output:
            <table>
                ${Array.from(output).map((value, i) => `
                    <tr>
                        <td>Class ${i + 1}</td>
                        <td>${value.toFixed(4)}</td>
                    </tr>
                `).join('')}
            </table>
        `;

    } catch (e) {

        console.error("ONNX runtime error:", e);
        alert("Error: " + e.message);

    }
}
</script>
</body>
</html>
