<!DOCTYPE html>
<html>
<head>
	<title>Classification of Death Due to Covid</title>
	<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<style>
	table, th, td {border: 1px solid;}
	#leftbox{float: left; width: 60%; height: 300px;}
	#boxes1:after{content: ""; display: block; clear: both}
	#predictions1{float: right; width: 35%;}
</style>
</head>
<body>
<h1>Classification of Death Due to Covid</h1>
<div id = "boxes1">
	<div id="leftbox">
		<h2>Input Data</h2>
		<label>Medical Surveillance System Indicator</label>
		<select id="box0c1">
    			<option value="1">1</option>
    			<option value="2">2</option>
			<option value="3">3</option>
		</select><br/>
		<label>Medical unit identifier</label>
		<select id="box1c1">
    			<option value="1">1</option>
    			<option value="2">2</option>
    			<option value="3">3</option>
    			<option value="4">4</option>
    			<option value="5">5</option>
    			<option value="6">6</option>
    			<option value="7">7</option>
    			<option value="8">8</option>
    			<option value="9">9</option>
    			<option value="10">10</option>
    			<option value="11">11</option>
    			<option value="12">12</option>
    			<option value="13">13</option>
		</select><br/>
		<label>Sex:</label>
		<select id="box2c1">
    			<option value="1">Female</option>
    			<option value="2">Male</option>
		</select><br/>
		<label>Patient Type:</label>
		<select id="box3c1">
    			<option value="1">Home</option>
    			<option value="2">Hospitalization</option>
		</select><br/>
		<label>Intubed:</label>
		<select id="box4c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Pneumonia:</label>
		<select id="box5c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<input type="text" id="box6c1" value="">Age (Just Integer in Years)<br/>
		<label>Pregnant:</label>
		<select id="box7c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Diabetes:</label>
		<select id="box8c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>COPD:</label>
		<select id="box9c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Asthma:</label>
		<select id="box10c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Immunosuppressed:</label>
		<select id="box11c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Hypertension:</label>
		<select id="box12c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Other Diseases:</label>
		<select id="box13c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Cardiovascular Problems:</label>
		<select id="box14c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Obesity:</label>
		<select id="box15c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Renal Chronic:</label>
		<select id="box16c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<label>Tobacco Use:</label>
		<select id="box17c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<input type="text" id="box18c1" value="">Covid Test Result    (1-3 means covid) (4+ means no or inconclusive)<br/>
		<label>Admitted to ICU</label>
		<select id="box19c1">
    			<option value="1">Yes</option>
    			<option value="2">No</option>
		</select><br/>
		<div><input type="button" value="Run" onclick="runExample1()"/></div>
	</div>
	<div id = "predictions1">
</div>
		
<main>
</main>
<script>
let session;

async function runExample1() {
	

    const x = new Float32Array(20);

    for (let i = 0; i < 20; i++) {

	    let id = 'box' + i + 'c1';
	    let element = document.getElementById(id);
	
	    if (element == null) {
	        console.error("Could not find HTML element:", id);
	        alert("Missing HTML element: " + id);
	        return;
	    }
	
	    x[i] = parseFloat(element.value) || 0;
	}

    const tensorX = new ort.Tensor('float32', x, [1, 20]);

    try {

        if (!session) {
            session = await ort.InferenceSession.create("GoodClassDL.onnx");
        }
		const inputName = session.inputNames[0];
		const outputName = session.outputNames[0];
        const results = await session.run({[inputName]: tensorX});

        const output = results[outputName].data;

        const predictions = document.getElementById('predictions1');

        predictions.innerHTML = `
            <hr>
            Output:
            <table>
                ${Array.from(output).map((value, i) => `
                    <tr>
                        <td>Class ${i + 1}</td>
                        <td>${value.toFixed(4)}</td>
                    </tr>
                `).join('')}
            </table>
        `;

    } catch (e) {

        console.error("ONNX runtime error:", e);
        alert("Error: " + e.message);

    }
}
</script>
</body>
</html>
